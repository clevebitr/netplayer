dependencies {
    compileOnly 'com.google.code.gson:gson:2.11.0'

    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Live WebSocket check against a running signaling server:
    //   ./gradlew :core:test -Pnetplayer.signal.url=ws://127.0.0.1:8787/
    systemProperty 'netplayer.signal.url',
            project.findProperty('netplayer.signal.url') ?: System.getProperty('netplayer.signal.url', '')
}
