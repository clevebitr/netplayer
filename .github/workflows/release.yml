name: release

# Stable releases come from a version tag (v1.0.0 -> netplayer-1.0.0.jar), every push to main
# still produces a beta build so the latest commit is always downloadable.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0-beta-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        run: |
          chmod +x gradlew
          ./gradlew build -Pmod_version=${{ steps.version.outputs.name }} --no-daemon --stacktrace

      - name: collect jars
        run: |
          mkdir -p dist
          cp mod/build/libs/netplayer.jar "dist/netplayer-${{ steps.version.outputs.name }}.jar"
          cp server/build/libs/netplayer-server.jar "dist/netplayer-server-${{ steps.version.outputs.name }}.jar"

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: NetPlayer ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Minecraft 1.21.11 / NeoForge 21.11.x, client side only.

            - `netplayer-${{ steps.version.outputs.name }}.jar` -> put into `mods/`
            - `netplayer-server-${{ steps.version.outputs.name }}.jar` -> `java -jar netplayer-server-*.jar --port 25566`
            - Cloudflare Workers signaling: see `signal-worker/README.md` (`npx wrangler deploy`)

            Clients and the signaling server must be the same generation: 1.0 changed the presence
            payload and the signed handshake strings, an 0.1.x client cannot talk to a 1.0 server.
          files: |
            dist/*.jar
